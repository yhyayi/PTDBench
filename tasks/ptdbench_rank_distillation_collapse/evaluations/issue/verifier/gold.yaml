category: objective_design
framework: verl
task: ptdbench_rank_distillation_collapse
verdict: unhealthy
root_cause:
  - Adjacent ranking constrains teacher-top-8 score differences but not their total probability against the rest of the vocabulary.
  - A common shift of only the candidate logits preserves every ranking-loss term while their softmax mass can approach zero.
  - Full-vocabulary normalization cancels inside the differences; shared network parameters can still change outside-token scores.
evidence_metrics:
  - A/B candidate probability mass falls from about 0.93 to 0.000667/0.000378; entropy rises to 11.75/11.80.
  - AIME25 reaches zero at step 100; all three validation sets reach zero at step 140; generated text is incoherent.
  - Fixed clean prefixes show lower ranking loss but lower teacher-set mass and higher entropy.
  - Reducing teacher ties to about one part per million does not prevent the same failure.
limits:
  - The invariance is mathematically established; a unique triggering hyperparameter is not causally isolated.
  - Flatness does not imply that gradient descent must choose the degenerate direction.
  - Historical overlap/top1 diagnostics are invalid and distinct from the target issue.
scoring:
  weights:
    verdict_score: 0.2
    root_cause_score: 0.6
    evidence_score: 0.2
  pass_score: 0.8
  incomplete_mechanism_root_cause_cap: 0.5
  incorrect_sole_cause_root_cause_cap: 0.25
  unsupported_causal_certainty_root_cause_cap: 0.5
notes: The unchanged shared judge reads oracle.md; this YAML is a structured audit summary, not a second executable scoring implementation.
