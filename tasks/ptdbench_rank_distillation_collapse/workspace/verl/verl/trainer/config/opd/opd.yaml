# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Colocated On-Policy Distillation (OPD) via KL-in-reward.
# The teacher shares the actor's GPUs as a forward-only inner engine worker, and
# the per-token (and per-candidate-token) reverse KL is fed to the policy
# gradient as an advantage. See docs and examples/opd_colocate.

# Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
_target_: verl.workers.config.OPDConfig

# whether colocated OPD is enabled
enable: False

# legacy: existing OPD; adjacent_logistic: O3PD; topk_jsd: matched-candidate JSD.
objective: legacy

# Coefficient for direct top-K objectives only.
loss_coef: 1.0

# adjacent_logistic only: drop adjacent pairs with exactly equal teacher scores
# (ordered_topk breaks such ties by token ID). The mean still divides by K - 1.
mask_teacher_ties: False

# Direct objectives only: teacher LM head as an fp32 product of upcast hidden states
# and weights, so its logits are not rounded to the bf16 grid before top-K selection.
teacher_fp32_head: False

# HF path (or local path) of the teacher model. Must share the student's tokenizer.
teacher_model_path: null

# 0 selects naive sampled-token OPD: the advantage is -(log pi_s - log pi_t) at the
# sampled token only. >0 selects top-k OPD over a candidate token set per position.
top_k: 0

# how the per-position candidate token set is chosen when top_k > 0:
# only_stu: the student's own top-k tokens
# only_tch: the teacher's top-k tokens
# intersection: tokens in both top-k sets (others are masked out)
# union: the concatenation of both top-k sets, deduplicated by masking
strategy: only_stu

# probability weighting applied across the K candidates before they enter the
# advantage. When is_norm=False these are raw full-vocabulary probabilities;
# when is_norm=True they are renormalized over the candidate set.
# student_p: student probability
# teacher_p: teacher probability
# none: uniform weights over the valid candidates
reward_weight_mode: student_p

# whether to renormalize student/teacher log-probs over the selected candidate
# set before computing their difference, and to use the same conditional student
# distribution in the actor PPO ratio/score; only applies when top_k > 0
is_norm: False

# whether to add all non-candidate vocabulary tokens as one aggregated bucket
# in the KL objective. Requires top_k > 0, is_norm=False, and student_p weighting.
outside_bucket: False

# temperature applied to the teacher logits before the log_softmax
teacher_temperature: 1.0

# number of packed tokens processed per chunk when building top-k / gathered
# log-probs. Bounds the transient [chunk_size, vocab] buffer.
chunk_size: 4096

# KL estimator used to turn the log-prob difference into a reward. Only k1
# (the plain log ratio) is supported: it is the unbiased one under the policy
# gradient formulation.
kl_estimator: k1

# weight of the task-reward GRPO advantage when adv_estimator=opd_token_kl_plus_grpo
grpo_outcome_weight: 1.0

# lower bound of the sampled-token OPD advantage (log pi_t - log pi_s); only
# applies when top_k=0. null disables the lower clip.
sampled_adv_clip_min: null

# upper bound of the sampled-token OPD advantage; only applies when top_k=0.
# null disables the upper clip.
sampled_adv_clip_max: null

# HF path of the teacher before RL. When set, sampled-token OPD becomes Direct-OPD:
# the advantage is the teacher's RL shift log pi_t - log pi_t_ref at the sampled
# token instead of log pi_t - log pi_s. Requires top_k=0. With full_vocab.target=diff
# it is the T0 scorer of the full-vocabulary Direct-OPD target. null disables it.
teacher_ref_model_path: null

# Multi-Diff OPD: post-RL teachers sharing teacher_ref_model_path, each
# {name: str, path: str, tags: [str]}. A sample goes to the teacher whose tags hold
# its route_field value. Replaces teacher_model_path; needs top_k=0.
# With full_vocab.target=diff the teachers are not routed: every sample takes their
# consensus shift (see full_vocab.teacher_weights), and tags must be left empty.
teachers: []

# per-sample dataset field read for routing (ms-swift's teacher_tag_key)
route_field: ability

# hard: each sample takes its routed teacher's shift. sum: every sample takes the sum
# of all teachers' shifts (ablation without routing).
route_mode: hard

# per-teacher multiplier of its shift, keyed by teacher name; missing names keep 1.0.
# null (not {}) so that a CLI override can assign a whole dict under struct mode.
domain_adv_scale: null

# token ids whose sampled-token advantage is zeroed (top_k=0 only)
mask_token_ids: []

# Full-vocabulary OPD: the teacher exports only its LM-head input hidden; the student
# rebuilds the teacher distribution chunk by chunk in its fused forward and minimizes
# the exact per-token reverse KL. Needs top_k=0 and model.use_fused_kernels=True
# (impl_backend=torch) on the actor.
full_vocab:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.OPDFullVocabConfig

  # whether full-vocabulary OPD is enabled
  enable: False

  # rkl: KL(p_stu || p_tch). diff: full-vocabulary Direct-OPD,
  # KL(p_stu || q) with q ∝ p_S0 * (p_T+ / p_T0)^(1/beta); S0 is the frozen initial student
  # (the reference policy), so it needs actor.use_kl_loss=True, and
  # teacher_ref_model_path (T0) must be set.
  target: rkl

  # rows per [chunk_size, vocab] fp32 buffer in the student's fused LM head
  chunk_size: 256

  # weight of the aggregated reverse KL in the actor loss
  loss_coef: 1.0

  # diff target only: q ∝ p_S0 * (p_T+ / p_T0)^(1/beta), the minimizer of the squared
  # residual beta * log(p_stu / p_S0) - log(p_T+ / p_T0). Larger beta stays closer to S0.
  # Only q changes; loss_coef=2*beta^2 recovers the squared-residual gradient scale.
  beta: 1.0

  # diff target with several opd.teachers: weight of each teacher's shift in the consensus
  # sum_k w_k * log p_T_k - log p_T0, keyed by teacher name and normalized to sum to 1.
  # null weights every teacher equally, i.e. q ∝ p_S0 * (geometric mean of the T_k / p_T0)^(1/beta).
  teacher_weights: null
