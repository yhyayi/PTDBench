title: On-policy ranking distillation loses generation quality
submitter:
  name: Yaxuan Li
license: Apache-2.0
created_date: 2026-10-16
domain: code
model:
  name: DeepSeek-R1-Distill-Qwen-1.5B (student), DeepSeek-R1-Distill-Qwen-7B (teacher)
dataset:
  name: DAPO-Math-17k; AIME25, AIME26, AMC23 validation
training:
  framework: verl (local on-policy distillation extension)
  algo: On-policy top-8 adjacent logistic ranking distillation
  script: opd_train/run_recorded.sh
  script_args:
    - A
environment:
  image: rank-distillation-cpu
  env:
    HF_HUB_OFFLINE: "1"
    HF_DATASETS_OFFLINE: "1"
    WANDB_MODE: "disabled"
    PYTHONDONTWRITEBYTECODE: "1"
    OMP_NUM_THREADS: "2"
outcome:
  failure_type: training_collapse
  failure_reason: 'Two full-parameter ranking-distillation runs lose validation accuracy and become incoherent. Teacher-top-8 student probability mass falls from about 0.93 to below 0.001 while entropy rises to about 11.8 nats. The adjacent-ranking objective constrains differences within the selected set but leaves its probability mass relative to the rest of the vocabulary unconstrained; loss improvement therefore does not guarantee a useful generation distribution. The observed instability is consistent with this objective deficiency, but no single triggering hyperparameter has been causally isolated.'
