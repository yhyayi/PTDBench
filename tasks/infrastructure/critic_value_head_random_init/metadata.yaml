title: PPO critic value head randomly initialised instead of zeroed
submitter:
  name: czx
license: Apache-2.0
created_date: '2026-10-14'
domain: infrastructure
type: infrastructure
model:
  name: Qwen3-1.7B
dataset:
  name: Endless Terminals
training:
  framework: slime
  algo: ppo
  script: run.sh
environment:
  image: slime-v0.3.2-sglang0.5.15-torch2.11.0-flashattn2.8.3-cu129-py3.12
  env:
    # run.sh defaults NUM_GPUS=2 TP_SIZE=2; both evaluation instructions state a
    # full two-stage run needs 2 GPUs. (NUM_GPUS=1 TP_SIZE=1 also works on one
    # 80GB device, which is what the recorded runs used.)
    CUDA_VISIBLE_DEVICES: "0,1"
    NVIDIA_VISIBLE_DEVICES: "0,1"
outcome:
  failure_type: implementation_bug
  failure_reason: LinearForLastLayer.__init__ in slime/backends/megatron_utils/model_provider.py draws the critic's value head from normal_(0, init_method_std) instead of zeroing it, so a freshly built or reloaded critic opens with a random [1, hidden_size] projection of the backbone's final hidden state; Stage B's first train/critic-value_loss comes out ~7.2 (E[V^2] + pass_rate) instead of ~0.094 (mean(R^2), bounded by the binary reward), an ~77x inflation across the whole critic warmup window.
