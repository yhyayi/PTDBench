# defaults specify the default config from each component
defaults:

  # dp teacher config, inheriting from trainer/config/teacher/teacher.yaml
  - teacher

  # fsdp engine config
  - ../engine@fsdp_config: fsdp

  # teacher model config; `path` is overridden from `opd.teacher_model_path`
  - ../model@model: hf_model

  # load the reference default config, then apply the fields in the current yaml
  - _self_

# Target class for this configuration
_target_: verl.workers.config.FSDPActorConfig

# fsdp config
fsdp_config:

  # the teacher is forward only: no optimizer, no grads
  forward_only: True

  # offload teacher params to CPU by default; the teacher is only touched once per
  # step so the H2D transfer is cheap relative to keeping a second model resident
  param_offload: True

  # Whether to pad packed micro-batches to a bucket-aligned length
  pad_to_length: ${oc.select:actor_rollout_ref.teacher.pad_to_length,False}

  # Padding granularity, following the actor unless overridden
  pad_to_length_bucket: ${oc.select:actor_rollout_ref.actor.fsdp_config.pad_to_length_bucket,1024}

# teacher model, defaults to the student's knobs with the path swapped in
model:

  # resolved from opd.teacher_model_path at config time
  path: ${oc.select:opd.teacher_model_path,null}

  # the teacher is never trained, so recomputation buys nothing
  enable_gradient_checkpointing: False

  # follow the student's packing mode so cu_seqlens line up
  use_remove_padding: ${oc.select:actor_rollout_ref.model.use_remove_padding,True}

  # OPD needs raw logits to build top-k, so fused (logprob-only) kernels are unusable
  use_fused_kernels: False

  # follow the student
  trust_remote_code: ${oc.select:actor_rollout_ref.model.trust_remote_code,False}

  # follow the student
  use_shm: ${oc.select:actor_rollout_ref.model.use_shm,False}

# sequence parallel size
ulysses_sequence_parallel_size: ${oc.select:actor_rollout_ref.actor.ulysses_sequence_parallel_size,1}
