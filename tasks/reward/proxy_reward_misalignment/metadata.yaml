title: 'ppo_critic diagnosis: proxy_reward_misalignment'
submitter:
  name: 王嘉泽
license: MIT
created_date: '2026-08-18'
domain: post_train
type: reward
model:
  name: Qwen3-4B-Base
dataset:
  name: GuruMath fixed-16 controlled set
training:
  framework: verl
  algo: PPO-Critic
  script: run_buggy.sh
environment:
  image: ppo-critic-vimpo

  env:
    # run_buggy.sh 固定 4 卡：CUDA_VISIBLE_DEVICES=0,1,2,3 + N_GPUS_PER_NODE=4。
    # FSDP actor 与 vLLM rollout 共享这一组卡。
    CUDA_VISIBLE_DEVICES: "0,1,2,3"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3"
outcome:
  failure_type: reward_misalignment
  failure_reason: >-
    The custom reward wired into run_buggy.sh (ptdbench_case/type3_length_reward_v2_fn.py)
    scores the controlled training source by response brevity (1 - n_chars/4000) instead of
    mathematical correctness. PPO successfully optimizes the proxy — critic/rewards/mean rises
    and responses shorten — while genuine held-out correctness (val-core/math__math/acc/mean@1)
    declines from 0.78 to 0.59 across the 15 steps. Validation still scores real correctness,
    so the training objective and the target task are misaligned (reward hacking).
