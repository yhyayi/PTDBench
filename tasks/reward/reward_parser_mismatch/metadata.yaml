title: 'ppo_critic diagnosis: reward_parser_mismatch'
submitter:
  name: 王嘉泽
license: MIT
created_date: '2026-08-18'
domain: post_train
type: reward
model:
  name: Qwen3-4B-Base
dataset:
  name: GuruMath controlled smoke
training:
  framework: verl
  algo: PPO-Critic
  script: run_buggy.sh
environment:
  image: vllm0.11.0-torch2.8.0-flashattn2.8.3-cu128-py3.12

  env:
    # run_buggy.sh 固定 4 卡：CUDA_VISIBLE_DEVICES=0,1,2,3 + N_GPUS_PER_NODE=4。
    # FSDP actor 与 vLLM rollout 共享这一组卡。
    CUDA_VISIBLE_DEVICES: "0,1,2,3"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3"
outcome:
  failure_type: reward_parser_mismatch
  failure_reason: >-
    The custom reward wired into run_buggy.sh (ptdbench_case/buggy_reward_fn.py) extracts
    answers with an XML <answer>...</answer> regex, but GuruMath prompts and ground truth use
    boxed answers such as \boxed{16}. Every rollout misses the parser and receives score 0, so
    critic/rewards/mean and val-core accuracy stay flat at zero while PPO continues to execute
    normally.
