category: implementation
framework: verl
task: task_dapo_math_021
verdict: unhealthy
root_cause:
- name: uid_assigned_after_rollout_repeat
  where: verl/trainer/ppo/ray_trainer.py::RayPPOTrainer.fit
  observed: the per-prompt uid assignment was moved below `batch.repeat(repeat_times=rollout.n, interleave=True)` and `batch.union(gen_batch_output)`, so each of the train_batch_size*rollout_n sampled responses gets its own fresh UUID and every GRPO group is a singleton
  expected: uid is assigned before `self._get_gen_batch(batch)`, while the batch still has one row per prompt, so `repeat(interleave=True)` duplicates each uid rollout_n times and all samples from one prompt share a group key
  mechanism: compute_advantage passes non_tensor_batch["uid"] to compute_grpo_outcome_advantage as `index`; the len(group)==1 branch of that function silently substitutes id2mean=0.0 and id2std=1.0, so the group baseline is never subtracted and GRPO degenerates to baseline-free REINFORCE over the raw 0/1 reward
evidence_metrics:
- critic/advantages/mean equals critic/rewards/mean digit for digit at every logged step, instead of sitting near zero
- critic/advantages/min is exactly 0.0 and critic/advantages/max is exactly 1.0, matching the raw 0/1 reward range rather than a std-normalised group advantage
- a healthy run of the same recipe (train_batch_size 8, rollout.n 8, 0/1 reward) has a negative advantage minimum and a maximum of 2.4749 for a group with one correct response out of eight
- critic/returns/* tracks critic/advantages/* exactly, since the GRPO estimator returns the advantage tensor for both
- actor/pg_loss is of order 1e-2 (about minus the mean reward) rather than the order 1e-4 of a baseline-subtracted batch
- held-out val-core/math_dapo/acc/mean@1 does not improve over the run and actor/entropy falls faster than the healthy arm
- the run never crashes, warns, or changes tensor shapes; the singleton-group branch absorbs the defect silently
wrong_attributions:
- train_batch_size, rollout.n, actor learning rate, reward function, or absence of KL loss — all match the healthy recipe
- low absolute held-out accuracy on its own; the recipe's base accuracy is only a few percent
- "group size is 1" or "advantages are not normalised" stated without locating the uid assignment relative to batch.repeat — incomplete, must not receive full root_cause_score
fix:
  must:
  - target: uid_assigned_after_rollout_repeat
    direction: move the uid assignment back above `self._get_gen_batch(batch)`, so uids are per prompt and survive the rollout repeat
