title: 'data diagnosis: task_train_too_hard'
submitter:
  name: benchmark_evaluation
license: MIT
created_date: '2026-10-10'
domain: post_train
model:
  name: Qwen2.5-1.5B-Instruct
dataset:
  name: TACO
training:
  framework: verl
  algo: grpo
  script: examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh
environment:
  image: verl
  # 刻意不声明 CUDA_VISIBLE_DEVICES / NVIDIA_VISIBLE_DEVICES，和兄弟任务
  # （reward_design/*、verl_implementation/torch_functional）不同：本任务只有
  # issue 一级，agent 读历史快照、verifier 判 agent_answer.md，两段都不起训练。
  # 声明了 NVIDIA_VISIBLE_DEVICES，docker runtime 就会给 agent / verifier 容器加
  # `--gpus`（ptdbench/runtimes/providers/docker.py::_gpu_args），无卡机器上直接
  # 起不来。要复跑 readme.md 里那次 8 卡实验，用 PTDBENCH_DOCKER_GPUS 覆盖。
outcome:
  failure_type: data_difficulty_mismatch
  failure_reason: The training parquet contains only TACO VERY_HARD rows while the validation parquet contains only TACO EASY rows, so the training set is too hard and the train/validation difficulty does not match.
