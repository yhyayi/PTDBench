title: Slime ReTool GRPO run assessment
submitter:
  name: chenyinghao
license: Apache-2.0
created_date: '2026-09-30'
domain: math_tool_use
model:
  name: Qwen3-4B
dataset:
  name: DAPO-Math-17k (RL) + ReTool-SFT (SFT)
training:
  framework: slime
  algo: grpo
  script: examples/retool/retool_qwen3_4b_rl.sh
environment:
  image: slime-v0.3.2
  env:
    # recipe 固定要 8 卡：ray start --num-gpus 8 + --actor-num-gpus-per-node 8，
    # 再按 --rollout-num-gpus-per-engine 2 切 sglang engine。
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
outcome:
  failure_type: run_health_unknown
  failure_reason: The staged ReTool recipe requires independent evidence-based assessment; the ground-truth verdict is healthy because the multi-turn code-interpreter rollout, observation masking, token/log-prob alignment, math_dapo exact-match reward, and GRPO configuration follow the canonical ReTool reproduction with no injected defect, and frozen eval/aime at step 69 is about 25.7% accuracy
