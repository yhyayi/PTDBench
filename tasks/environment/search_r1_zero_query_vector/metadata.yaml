title: 'Search-R1 GRPO run assessment: search_r1_zero_query_vector'
submitter:
  name: chenyinghao
license: Apache-2.0
created_date: '2026-10-16'
domain: search_qa
model:
  name: Qwen2.5-1.5B-Instruct
dataset:
  name: HotpotQA distractor (1024 train / 128 held-out)
training:
  framework: search-r1-verl
  algo: grpo
  script: run.py
environment:
  image: search-r1-verl
  env:
    # 单卡任务：run.py 自己会把 CUDA_VISIBLE_DEVICES 设成 config.json 里的 gpu
    # （默认 0），train_grpo.sh 在 SEARCH_R1_SHORT_GRPO=1 下也只要一张卡
    # （trainer.n_gpus_per_node=1）。这里写成 "0" 是让容器里只露出一张，避免
    # vllm 和 FSDP 去探别人的卡。
    CUDA_VISIBLE_DEVICES: "0"
    NVIDIA_VISIBLE_DEVICES: "0"
    # train_grpo.sh:30 自己就 export 了这一行，写在这里只是让它在 --check 和
    # 任何手工探查里也成立：vllm 0.6.3 + qwen2 走 flash_attn 后端有已知问题，
    # 上游因此钉 XFORMERS。
    VLLM_ATTENTION_BACKEND: XFORMERS
    # run.py 把 W&B 强制成 offline 并把目录指到 run 下面；这里再写一遍是为了
    # 任何不经过 run.py 的探查也不会尝试联网登录。
    WANDB_MODE: offline
    WANDB_API_KEY: ptdbench-offline
    WANDB_SILENT: "true"
    TOKENIZERS_PARALLELISM: "false"
    # 这里**没有** HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE：断网这件事由框架按阶段
    # 设（runtimes/base.py 的 _network_policy_env），agent 和 verifier 阶段本来就带着
    # 这两个变量。写在这里则是三个阶段一视同仁，会把 prepare 自己下模型的那条路
    # 也堵死。run.py 另外会在训练进程里单独设 HF_HUB_OFFLINE=1。
outcome:
  failure_type: retriever_query_device_copy
  failure_reason: Encoder.encode returns an all-zero query embedding (the zero-filled CPU buffer it returns is never written, because torch.as_tensor(buffer, device=cuda) copies instead of aliasing it), so under METRIC_INNER_PRODUCT every document scores 0.0 and FAISS returns the same arbitrary top-3 for every query on both the rollout and the evaluation path; held-out val/em reaches only 15.6% at the 32-step horizon against 32.8% for the identical recipe with the query embedding copied to the host, and the gap is already open at step 0 (3.1% vs 13.3%)
