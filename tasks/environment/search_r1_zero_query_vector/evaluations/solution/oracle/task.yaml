task_id: search_r1_zero_query_vector
category: search_r1_implementation
framework: search-r1-verl
launch_script: run.py
model: Qwen2.5-1.5B-Instruct
dataset: HotpotQA distractor (1024 train / 128 held-out)
algo: grpo
recipe: Search-R1 train_grpo.sh, SEARCH_R1_SHORT_GRPO=1 single-GPU profile
expected_verdict: unhealthy
evidence_kind: historical_run
historical_cutoff_train_step: 32
last_eval_step: 32
eval_interval: 10
eval_metric_key: val/em
eval_first: 0.03125
eval_last: 0.15625
eval_max: 0.15625
held_out_accuracy_last: 0.15625
control_val_em_at_step_32: 0.328125
control_val_em_at_step_0: 0.1328125
note: >-
  Defect task. The workspace is the Search-R1 snapshot
  (598e61bd1d36895726d28a8d06b3a15bed19f5d3, veRL vendored) the recorded runs
  used, with one defect: Encoder.encode (search_r1/search/retrieval_server.py
  lines 117-120) returns an all-zero query embedding, because the zero-filled
  CPU buffer it returns is never written -- torch.as_tensor(buffer,
  device=cuda) copies instead of aliasing. Under METRIC_INNER_PRODUCT every
  document then scores 0.0, so FAISS returns a constant top-3 for every query
  and nothing raises. One retriever serves rollout and evaluation, so both are
  affected. Frozen evidence is a completed 32-step run (evals at 0, 10, 20, 30,
  32) that reaches val/em 0.15625. Solution grading is metric-only after a
  repair-and-rerun at the budget already in workspace/config.json: the best
  finite val/em must land in [0.24, 1.0]. The recorded control reaches 0.32813
  and starts at 0.13281, so the bar requires both the fix and a completed run.
  Calibrated on ONE run per side -- see verifier/README.md; a second pair is
  what would justify changing the bar.
key_files:
- Search-R1/search_r1/search/retrieval_server.py
- serve_retriever.py
- run.py
- config.json
- results/baseline32/retrieval.jsonl
- results/baseline32/metrics_summary.json
- results/baseline32/train.log
external_assets_not_in_git:
- Qwen2.5-1.5B-Instruct HF checkpoint (revision 989aa798...), delivered by
  environment/prepare.sh into workspace/shared/models/
- the intfloat/e5-base-v2 query encoder (revision f52bf8ec...), delivered by the
  same script; its model.safetensors hashes identically to the delivery's copy
  and to the one tasks/slime_search_r1_nomask pins
- shared/data/e5_Flat.index (37MB), rebuilt at prepare time from the shipped
  corpus by environment/build_index.py rather than carried in git; semantically
  but not bitwise the recorded index
shipped_in_git:
- workspace/shared/data/{train,test}.parquet and corpus.jsonl (6.9MB total),
  hashes in environment/data_manifest.json
- workspace/results/baseline32/ (~3.2MB), the defective run's own slimmed and
  path-sanitized record
