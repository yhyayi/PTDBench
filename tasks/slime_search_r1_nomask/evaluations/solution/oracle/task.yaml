task_id: slime_search_r1_nomask
category: slime_implementation
framework: slime
launch_script: examples/search-r1/run_qwen2.5_3B.sh
model: Qwen2.5-3B
dataset: Search-R1 nq_hotpotqa_train
algo: grpo
recipe: examples/search-r1
expected_verdict: unhealthy
evidence_kind: historical_run
historical_cutoff_train_step: 200
last_eval_step: 199
eval_interval: 10
eval_metric_key: eval/nq_test
eval_first: 0.048
eval_last: 0.16466666666666666
eval_max: 0.16566666666666666
held_out_accuracy_last: 0.16466666666666666
healthy_eval_nq_test_at_step_199: 0.4083333333333333
note: >-
  Defect task. The workspace is an upstream slime snapshot plus the in-tree
  examples/search-r1 recipe (multi-turn retrieval-augmented GRPO), with a
  single injected defect: generate_with_search.py::generate appends retrieved
  <information> tokens with loss_mask=1 so search-engine results are trained
  on. Frozen historical evidence covers train step 200 / last eval step 199
  (eval_interval 10). Solution grading is metric-only after a repair-and-rerun:
  best eval/nq_test must be at least 0.30 (historical 0.1647; healthy protocol
  about 0.408).
key_files:
- examples/search-r1/generate_with_search.py
- examples/search-r1/run_qwen2.5_3B.sh
- examples/search-r1/qa_em_format.py
- outputs/metrics.json
- outputs/historical_eval_trace.log
external_assets_not_in_git:
- Qwen2.5-3B HF checkpoint, delivered by environment/prepare.sh; its torch_dist
  reference is converted there too when the prepare stage finds a GPU with at
  least 12GiB free, and by the launch script's own guard otherwise
- the intfloat/e5-base-v2 query encoder the retrieval server loads, delivered by
  environment/prepare.sh
- Search-R1 nq_hotpotqa_train train/test parquet, rebuilt from pinned upstream
  jsonl by environment/prepare.sh (ptdbench_dataset --recipe search_r1_nq_hotpotqa)
- wiki-18 e5 FAISS index + corpus (~79GB assembled) for the local dense
  retriever, delivered by environment/prepare.sh (--recipe wiki18_e5); starting
  the retriever itself is still part of the rerun
