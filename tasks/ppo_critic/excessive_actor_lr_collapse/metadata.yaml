title: 'ppo_critic diagnosis: excessive_actor_lr_collapse'
submitter:
  name: 王嘉泽
license: MIT
created_date: '2026-08-18'
domain: post_train
model:
  name: Qwen3-4B-Base
dataset:
  name: GuruMath controlled smoke
training:
  framework: verl
  algo: PPO-Critic
  script: run_buggy.sh
environment:
  image: ppo-critic-vimpo

  env:
    # run_buggy.sh 固定 4 卡：CUDA_VISIBLE_DEVICES=0,1,2,3 + N_GPUS_PER_NODE=4。
    # FSDP actor 与 vLLM rollout 共享这一组卡。
    CUDA_VISIBLE_DEVICES: "0,1,2,3"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3"
outcome:
  failure_type: rl_policy_collapse
  failure_reason: >-
    run_buggy.sh exports LR=1e-2, which the VIMPO launcher passes straight to the actor
    optimizer as actor_rollout_ref.actor.optim.lr (recipe default 1e-6). The actor learning
    rate is 10,000x too large, so PPO runs all 8 steps but the policy degenerates: validation
    starts non-zero and falls to zero on both AIME and MATH, responses saturate the 1024-token
    limit, and actor entropy becomes highly unstable.
