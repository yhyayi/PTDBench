task_id: excessive_actor_lr_collapse
category: ppo_critic
bug_type: hyperparameter/actor_learning_rate
experiment_name: ptdbench-type1-actor-lr
created_at: '2026-08-18T00:00:00+00:00'
source_run: ptdbench_case/logs/observed_buggy_run.log
note: >-
  run_buggy.sh exports LR=1e-2; recipe/vimpo/run_vimpo_critic.sh passes it to the actor
  optimizer as actor_rollout_ref.actor.optim.lr="${LR:-1e-6}". The actor LR is 10,000x the
  intended 1e-6. PPO runs all 8 steps but the policy collapses: validation falls to zero,
  responses saturate 1024 tokens, actor/grad_norm and entropy destabilize. Fix: resolve the
  actor LR to 1e-6 on the real launcher-to-optimizer path.
oracle:
  primary_cause: 'Excessive actor learning rate (LR=1e-2) reaches the actor optimizer; stable target is 1e-6.'
  buggy_keys:
    - actor_lr
  buggy_args:
    actor_lr: 1.0e-02
  golden_args:
    actor_lr: 1.0e-06
  buggy_file: run_buggy.sh
  launcher_path: 'actor_rollout_ref.actor.optim.lr="${LR:-1e-6}"'
  needs_manual_review: true
scoring:
  diagnosis_scored: false
  formula: 0.8 * validation + 0.2 * training_reward
  metric_key: val-core/math__math/acc/mean@1
  training_reward_key: critic/rewards/mean
  validation_selector: terminal_final_step
  final_step: 8
  historical_final_baseline: '0.0'
  required_final_score: '0.10'
  required_training_reward: '0.05'
  calibration_status: draft_uncalibrated
