title: 'reward_design diagnosis: task_grpo_broadcast'
submitter:
  name: benchmark_evaluation
license: MIT
created_date: '2026-09-24'
domain: post_train
type: algorithm
model:
  name: Qwen2.5-1.5B-Instruct
dataset:
  name: TACO
training:
  framework: verl
  algo: grpo
  script: examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh
environment:
  image: verl
  env:
    # 启动脚本固定 8 卡：run_qwen2_5_1.5b_instruct_taco_fsdp.sh:26
    # NGPUS_PER_NODE=8，FSDP actor 与 vLLM rollout 共享这一组卡。
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
outcome:
  failure_type: implementation_bug
  failure_reason: compute_grpo_outcome_advantage lays the length-B GRPO advantages along the sequence axis and expands that row across the batch. The tensor stays [B, S], but tokens no longer receive their own sample's advantage. Independently, taco.py _to_bool_results calls ndarray.item(0); a size-0 comparison array from a call-based empty ndarray return raises IndexError and aborts training.
