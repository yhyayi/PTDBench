title: 'algorithm diagnosis: TACO GRPO run'
submitter:
  name: benchmark_evaluation
license: MIT
created_date: '2026-09-24'
domain: post_train
type: algorithm
model:
  name: Qwen2.5-1.5B-Instruct
dataset:
  name: TACO
training:
  framework: verl
  algo: grpo
  script: examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh
environment:
  image: verl-vllm0.17.0-torch2.10.0-flashattn2.8.3-cu129-py3.12
  env:
    # 启动脚本固定 8 卡：run_qwen2_5_1.5b_instruct_taco_fsdp.sh:26
    # NGPUS_PER_NODE=8，FSDP actor 与 vLLM rollout 共享这一组卡。
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
outcome:
  failure_type: implementation_bug
  failure_reason: "compute_grpo_outcome_advantage lays the length-B GRPO advantages along the sequence axis (reshape to [1, B], pad to the response length, expand across rows) instead of giving each row its own sample's scalar advantage. The tensor stays [B, S] so nothing crashes, but every row's tokens carry column-indexed advantages (position j gets sample j's value, positions past 128 get 0); the policy gradient is decoupled from each sample's reward. The recorded run keeps critic/rewards/mean near 0.12 while held-out acc stays flat (0.076 at step 0, 0.043-0.071 through step 250), and the token-weighted critic/advantages/mean collapses to ~0 (median |mean| 4.9e-4, 8-19x below correct TACO runs)."
