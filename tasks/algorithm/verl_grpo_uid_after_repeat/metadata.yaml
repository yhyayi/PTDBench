title: 'llama_dapo_implementation algorithm diagnosis: task_dapo_math_021'
submitter:
  name: benchmark_evaluation
license: MIT
created_date: '2026-10-17'
domain: post_train
model:
  name: Llama-3.2-1B-Instruct
dataset:
  name: DAPO-Math-17k
training:
  framework: verl
  algo: grpo
  script: examples/grpo_trainer/run_llama3_2_1b_instruct_dapo_math_fsdp.sh
environment:
  image: verl
  env:
    CUDA_VISIBLE_DEVICES: "0,1"
    NVIDIA_VISIBLE_DEVICES: "0,1"
outcome:
  failure_type: implementation_bug
  failure_reason: "The per-prompt uid assignment in RayPPOTrainer.fit was moved below batch.repeat(repeat_times=rollout.n, interleave=True), so every sampled response gets its own UUID and each GRPO group is a singleton; compute_grpo_outcome_advantage silently substitutes mean 0 / std 1 for single-element groups, so the group baseline is never subtracted and advantages collapse onto the raw 0/1 reward (critic/advantages/mean equals critic/rewards/mean, min exactly 0.0, max exactly 1.0) while held-out val-core/math_dapo/acc/mean@1 fails to improve."
