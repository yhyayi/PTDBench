# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Teacher model config for colocated On-Policy Distillation (OPD).
# The teacher is a forward-only inner engine worker living in the actor's
# resource pool, i.e. it shares GPUs with the student instead of requiring a
# dedicated pool. Only enabled when `opd.enable=True`.

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

# same engine backend as the actor
strategy: ${actor_rollout_ref.actor.strategy}

# whether to enable torch.compile
use_torch_compile: ${oc.select:actor_rollout_ref.actor.use_torch_compile,true}

# [Will be deprecated, use log_prob_micro_batch_size_per_gpu]
# The batch size for one forward pass in the computation of log_prob. Global batch size.
log_prob_micro_batch_size: null

# The batch size for one forward pass in the computation of log_prob. Local batch size per GPU.
# Follows the actor, then the ref model: all three are the same sequences, and the teacher's
# forward is no heavier than the actor's (no backward, but a vocab-sized gather).
log_prob_micro_batch_size_per_gpu: ${oc.select:actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu,${oc.select:actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu,null}}

# enable dynamic batch size (sequence packing) for log_prob computation
log_prob_use_dynamic_bsz: ${oc.select:actor_rollout_ref.actor.use_dynamic_bsz,false}

# the max token length per GPU
log_prob_max_token_len_per_gpu: ${oc.select:actor_rollout_ref.actor.ppo_max_token_len_per_gpu,16384}

# Not read by the teacher engine, which takes the entropy knobs from fsdp_config
# (only Direct-OPD computes the teacher entropy).
entropy_from_logits_with_chunking: False

# chunk size for entropy from logits with chunking
entropy_from_logits_chunk_size: 2048

# recompute entropy
entropy_checkpointing: False

# pad every packed micro-batch to a fixed token count, following the actor unless overridden
pad_to_length: ${oc.select:actor_rollout_ref.actor.pad_to_length,False}
