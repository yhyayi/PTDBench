title: 'verl_implementation diagnosis: context_parallel_oom'
submitter:
  name: benchmark_evaluation
license: MIT
created_date: '2026-10-13'
domain: post_train
type: configuration
model:
  name: Qwen2.5-1.5B-Instruct
dataset:
  name: TACO
training:
  framework: verl
  algo: grpo
  script: examples/grpo_trainer/run_qwen2_5_1.5b_instruct_taco_fsdp.sh
environment:
  image: verl
  env:
    # 启动脚本固定 8 卡：run_qwen2_5_1.5b_instruct_taco_fsdp.sh
    # NGPUS_PER_NODE=8，FSDP actor 与 vLLM rollout 共享这一组卡。
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
outcome:
  failure_type: resource_error
  failure_reason: the FSDP launch keeps context parallel at ulysses_sequence_parallel_size=1 while max_response_length is 30720 and gradient checkpointing is off, so once repetition fills a response to that cap each H800 materializes a full 32768-token activation and OOMs; the repair is to raise actor and ref context parallel to 4 without changing max_response_length
