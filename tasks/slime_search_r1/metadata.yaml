title: Slime Search-R1 GRPO run assessment
submitter:
  name: chenyinghao
license: Apache-2.0
created_date: '2026-08-19'
domain: search_qa
model:
  name: Qwen2.5-3B
dataset:
  name: Search-R1 nq_hotpotqa_train
training:
  framework: slime
  algo: grpo
  script: examples/search-r1/run_qwen2.5_3B.sh
environment:
  image: slime-v0.3.2
  env:
    # recipe 固定要 8 卡：ray start --num-gpus 8 + --actor-num-gpus-per-node 8，
    # 再按 --rollout-num-gpus-per-engine 2 切 sglang engine。
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    NVIDIA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    # 这个块和另一个 search-r1 任务逐字相同：两个任务跑同一个 recipe，容器环境上的
    # 任何差别都会让两边的重跑不可比。
    #
    # 这里**没有** HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE：断网这件事由框架按阶段
    # 来设（runtimes/base.py 的 _network_policy_env），agent 和 verifier 阶段本来就带着这两个变量，
    # 评测过程因此取不到 hub 上的东西（run_qwen2.5_3B.sh:72-76 的 `hf download`
    # 守卫会快速失败，而不是在无网的容器里干等）。写在这里则是三个阶段一视同仁，
    # 会把 prepare 自己下载权重和数据集的那条路也堵死。
    #
    # WANDB_API_KEY 必须有值：run_qwen2.5_3B.sh 的 WANDB_ARGS 里写的是不带引号的
    # `--wandb-key ${WANDB_API_KEY}`，空展开会把 `--wandb-key` 和后面一个数组元素
    # 拼到一起，argparse 报的错离原因很远。
    WANDB_MODE: offline
    WANDB_API_KEY: ptdbench-offline
    WANDB_SILENT: "true"
    TOKENIZERS_PARALLELISM: "false"
outcome:
  failure_type: run_health_unknown
  failure_reason: The staged Search-R1 recipe requires independent evidence-based assessment; the ground-truth verdict is healthy because the multi-turn search rollout, observation masking, token/log-prob alignment, exact-match reward, and GRPO configuration follow the canonical Search-R1 reproduction with no injected defect, and frozen eval/nq_test at step 99 is about 37.5% accuracy
