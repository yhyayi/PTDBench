# conda's half of the `slime-v0.3.1` environment. See
# docker/envs/slime-rc0/conda.yaml for why the split between conda and pip is
# drawn where it is.
#
# This is the `slimerl/slime:latest` stack, as of slime 0.3.1 (2026-08). It is
# a different stack from slime-rc0 (v0.5.0rc0-cu126), not a newer patch of it:
# CUDA 12.6 -> 13.0, torch 2.8 -> 2.11, sglang 0.5.0rc0 -> 0.5.15.post1,
# transformers 4.55 -> 5.12, transformer_engine 2.5 -> 2.16, megatron-core
# 0.15.0rc1 -> 0.16. slime's own API surface moved with it -- the retool
# recipe imports sglang.srt.constants, which does not exist at 0.5.0rc0 -- so
# the two cannot be collapsed into one environment. See docker/envs/README.md.
name: slime-v0.3.1
channels:
  - conda-forge
dependencies:
  # Matches slimerl/slime:latest exactly (3.12.3 -- the Ubuntu 24.04 system
  # interpreter that image builds on). The ABI tag cp312 is what the wheels
  # care about; the patch version is pinned anyway so a rebuild years from now
  # resolves to the same interpreter.
  - python=3.12.3
  # nvcc 13.0 -- a third major.minor: verl is on 12.9, slime-rc0 on 12.6. It is
  # 13.0 and not 12.9 because sglang 0.5.15.post1 requires it (cuda-python>=13,
  # flashinfer[cu13], nvidia-cutlass-dsl[cu13]). Three nvccs in one image is
  # the whole reason these are conda prefixes and not venvs, and this one makes
  # it a CUDA *major* split rather than just a minor one.
  - cuda-toolkit=13.0.*
  # Headers live under $PREFIX/targets/x86_64-linux/include. The toolkit
  # metapackage usually pulls these; naming them keeps TE's and apex's sdist
  # compiles from dying on cuda_runtime_api.h if it ever drops -dev.
  - cuda-cudart-dev=13.0.*
  - cuda-cccl=13.0.*
  - git
  - git-lfs
