# conda's half of the `slime-rc0` environment.
#
# Deliberately tiny. conda owns exactly three things -- the interpreter, nvcc,
# and the system-level build libraries -- and pip owns every Python package
# (requirements.txt). Mixing the two over the same package is where conda/pip
# environments go wrong, so the split is by *layer*, not by preference.
#
# cuda-toolkit is here rather than in the base image because it is the reason
# this design uses conda at all: `slime-rc0` is compiled against 12.6 while
# `verl` and `slime-v0.3.1` are compiled against 12.9, and a venv cannot hold
# two nvccs. It installs into the env prefix, so CUDA_HOME == the prefix the
# packages will run from.
name: slime-rc0
channels:
  - conda-forge
dependencies:
  # Matches slimerl/slime:v0.5.0rc0-cu126 exactly (3.12.11). The ABI tag 3.12
  # is what the wheels care about; the patch version is pinned anyway so a
  # rebuild years from now resolves to the same interpreter.
  - python=3.12.11
  # nvcc 12.6.68 upstream. conda-forge's cuda-toolkit metapackage pulls nvcc,
  # cudart, the headers and the stub libs under the prefix.
  - cuda-toolkit=12.6.*
  - cuda-cudart-dev=12.6.*
  - cuda-cccl=12.6.*
  - git
  - git-lfs
