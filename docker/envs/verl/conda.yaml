# conda's half of the `verl` environment. See docker/envs/slime/conda.yaml for
# why the split between conda and pip is drawn where it is.
name: verl
channels:
  - conda-forge
dependencies:
  # Matches verlai/verl:vllm017.latest exactly (3.12.13).
  - python=3.12.13
  # nvcc 12.9.86 upstream -- the whole reason verl and slime cannot share one
  # environment.
  - cuda-toolkit=12.9.*
  # Headers live under $PREFIX/targets/x86_64-linux/include. The toolkit
  # metapackage usually pulls these; naming them keeps TE's sdist compile
  # from dying on cuda_runtime_api.h if the metapackage ever drops -dev.
  - cuda-cudart-dev=12.9.*
  - cuda-cccl=12.9.*
  - git
  - git-lfs
