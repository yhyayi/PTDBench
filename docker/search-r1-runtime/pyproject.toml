[project]
name = "search-r1-training-runtime"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "accelerate==1.1.1",
    "codetiming==1.4.0",
    "datasets==3.1.0",
    "dill==0.3.8",
    "faiss-cpu==1.14.2",
    "fastapi==0.115.5",
    "flash-attn==2.6.3",
    "httpx==0.27.2",
    "hydra-core==1.3.2",
    "ipython==8.29.0",
    "matplotlib==3.9.2",
    "ninja==1.11.1.1",
    "numpy==1.26.4",
    "openai==1.54.4",
    "packaging==24.2",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "pybind11==2.13.6",
    "ray==2.40.0",
    "setuptools==75.6.0",
    "tensordict==0.5.0",
    "torch==2.4.0",
    "transformers==4.46.3",
    "uvicorn==0.32.1",
    "vllm==0.6.3",
    "wandb==0.18.7",
    "wheel==0.45.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.6.3"
requires-dist = ["torch", "einops"]
